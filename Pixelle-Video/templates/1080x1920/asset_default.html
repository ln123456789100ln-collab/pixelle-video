<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="template:media-width" content="1024">
    <meta name="template:media-height" content="1024">
    <style>
        {{font_import}}
        html, body {
            margin: 0;
            padding: 0;
            width: 1080px;
            height: 1920px;
            overflow: hidden;
        }

        body {
            font-family: '{{font_name=PingFang SC}}', 'PingFang SC', 'Source Han Sans', 'Microsoft YaHei', sans-serif;
            background: transparent;
        }

        .page-container {
            width: 1080px;
            height: 1920px;
            position: relative;
            overflow: hidden;
        }

        .background-layer {
            position: absolute; top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: 0;
        }
        .background-layer img {
            width: 100%; height: 100%;
            object-fit: cover;
            display: block;
        }
        .background-layer video {
            width: 100%; height: 100%;
            object-fit: cover;
            display: block;
        }
        .background-layer:empty { display: none; }

        .gradient-overlay {
            position: absolute; top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: 1;
            background: linear-gradient(to bottom,
                rgba(0,0,0,0.60) 0%,
                rgba(0,0,0,0.05) 22%,
                rgba(0,0,0,0.05) 58%,
                rgba(0,0,0,0.80) 100%);
        }

        .content-layer {
            position: relative; z-index: 2;
            width: 100%; height: 100%;
            padding: 100px 80px 0px 80px;
            box-sizing: border-box;
            display: flex; flex-direction: column;
            justify-content: flex-start;
            color: {{text_color=#ffffff}};
        }

        .video-title {
            font-size: 76px;
            font-weight: 800;
            line-height: 1.25;
            text-align: center;
            margin-bottom: 36px;
            color: {{text_color=#ffffff}};
            text-shadow: 0 0 24px rgba(0,0,0,0.8), 0 4px 12px rgba(0,0,0,0.5);
        }
        .video-title:empty { display: none; }

        .spacer { flex-grow: 1; }

        .subtitle-wrapper {
            margin-bottom: 70px;
            text-align: center;
        }

        .text-pill {
            display: inline-block;
            max-width: 92%;
            padding: 24px 44px;
            border-radius: 22px;
            font-size: {{text_size=48}}px;
            font-weight: 700;
            line-height: 1.55;
            color: {{text_color=#ffffff}};
            word-break: break-word;
            {% if text_bg == 'true' %}
            background: rgba(0,0,0,0.60);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255,255,255,0.10);
            {% endif %}
            {% if text_stroke == 'true' %}
            -webkit-text-stroke: 2px rgba(0,0,0,0.9);
            text-shadow: 2px 2px 0 #000, -2px -2px 0 #000, 2px -2px 0 #000, -2px 2px 0 #000, 0 0 14px rgba(0,0,0,0.7);
            {% else %}
            text-shadow: 0 3px 10px rgba(0,0,0,0.6);
            {% endif %}
        }
    </style>
</head>

<body>
    <div class="page-container">
        <div class="background-layer" id="bg-layer"></div>
        <div class="gradient-overlay"></div>

        <div class="content-layer">
            <div class="video-title">{{title}}</div>
            <div class="spacer"></div>
            <div class="subtitle-wrapper">
                <span class="text-pill">{{text}}</span>
            </div>
        </div>
    </div>

    <script>
        (function() {
            var imageUrl = "{{image}}";
            var bgLayer = document.getElementById('bg-layer');
            if (imageUrl && imageUrl.trim() !== "" && imageUrl !== "None") {
                var ext = imageUrl.split('.').pop().toLowerCase().split('?')[0];
                if (['mp4','mov','webm','avi'].indexOf(ext) >= 0) {
                    // 视频素材: 不创建 <video> 元素
                    // Chromium 无头模式无法在截图中捕获视频帧
                    // body 背景已设为 transparent
                    // bg-layer 保持空 → display: none → 叠加层透明
                    // 原始视频在后续 overlay_image_on_video() 步骤中叠加
                } else {
                    var img = document.createElement('img');
                    img.src = imageUrl;
                    img.alt = "";
                    bgLayer.appendChild(img);
                }
            }
        })();
    </script>
</body>
</html>
