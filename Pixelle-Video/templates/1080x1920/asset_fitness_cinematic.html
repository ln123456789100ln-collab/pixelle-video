<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="template:media-width" content="1024">
    <meta name="template:media-height" content="1024">
    <style>
        {{font_import}}
        html, body {
            margin: 0; padding: 0;
            width: 1080px; height: 1920px;
            overflow: hidden;
        }
        body {
            font-family: '{{font_name=PingFang SC}}', 'PingFang SC', 'Source Han Sans', 'Microsoft YaHei', sans-serif;
            background: transparent;
        }
        .page-container {
            width: 1080px; height: 1920px;
            position: relative; overflow: hidden;
        }
        .background-layer {
            position: absolute; top: 0; left: 0;
            width: 100%; height: 100%; z-index: 0;
        }
        .background-layer img, .background-layer video {
            width: 100%; height: 100%;
            object-fit: cover; display: block;
        }
        .background-layer:empty { display: none; }

        /* Cinematic: 上下双渐变（letterbox感）+ 宽字距标题 + 纤细字幕 */
        .gradient-overlay {
            position: absolute; top: 0; left: 0;
            width: 100%; height: 100%; z-index: 1;
            background: linear-gradient(to bottom,
                rgba(0,0,0,0.55) 0%,
                rgba(0,0,0,0.20) 15%,
                rgba(0,0,0,0.00) 35%,
                rgba(0,0,0,0.00) 65%,
                rgba(0,0,0,0.20) 85%,
                rgba(0,0,0,0.70) 100%);
        }
        .content-layer {
            position: relative; z-index: 2;
            width: 100%; height: 100%;
            padding: 100px 90px 0px 90px;
            box-sizing: border-box;
            display: flex; flex-direction: column;
            justify-content: flex-start;
            align-items: center;
        }
        .video-title {
            font-size: 64px; font-weight: 800;
            line-height: 1.3; text-align: center;
            margin-bottom: 32px;
            color: #ffffff;
            letter-spacing: 0.06em;
            text-shadow: 0 0 28px rgba(0,0,0,0.8), 0 2px 8px rgba(0,0,0,0.4);
        }
        .video-title:empty { display: none; }
        .spacer { flex-grow: 1; }
        .subtitle-wrapper {
            margin-bottom: 72px; text-align: center;
        }
        .text-pill {
            display: inline-block;
            max-width: 88%;
            padding: 18px 40px;
            border-radius: 4px;
            font-size: 42px;
            font-weight: 400;
            line-height: 1.5;
            color: rgba(255,255,255,0.90);
            word-break: break-word;
            letter-spacing: 0.05em;
            text-shadow: 0 0 16px rgba(0,0,0,0.75);
            border-bottom: 2px solid rgba(255,255,255,0.15);
        }
    </style>
</head>
<body>
    <div class="page-container">
        <div class="background-layer" id="bg-layer"></div>
        <div class="gradient-overlay"></div>
        <div class="content-layer">
            <div class="video-title">{{title}}</div>
            <div class="spacer"></div>
            <div class="subtitle-wrapper">
                <span class="text-pill">{{text}}</span>
            </div>
        </div>
    </div>
    <script>
        (function() {
            var imageUrl = "{{image}}";
            var bgLayer = document.getElementById('bg-layer');
            if (imageUrl && imageUrl.trim() !== "" && imageUrl !== "None") {
                var ext = imageUrl.split('.').pop().toLowerCase().split('?')[0];
                if (['mp4','mov','webm','avi'].indexOf(ext) >= 0) {
                } else {
                    var img = document.createElement('img');
                    img.src = imageUrl;
                    img.alt = "";
                    bgLayer.appendChild(img);
                }
            }
        })();
    </script>
</body>
</html>
