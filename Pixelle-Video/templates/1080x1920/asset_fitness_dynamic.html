<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="template:media-width" content="1024">
    <meta name="template:media-height" content="1024">
    <style>
        {{font_import}}
        html, body {
            margin: 0; padding: 0;
            width: 1080px; height: 1920px;
            overflow: hidden;
        }
        body {
            font-family: '{{font_name=PingFang SC}}', 'PingFang SC', 'Source Han Sans', 'Microsoft YaHei', sans-serif;
            background: transparent;
        }
        .page-container {
            width: 1080px; height: 1920px;
            position: relative; overflow: hidden;
        }
        .background-layer {
            position: absolute; top: 0; left: 0;
            width: 100%; height: 100%; z-index: 0;
        }
        .background-layer img, .background-layer video {
            width: 100%; height: 100%;
            object-fit: cover; display: block;
        }
        .background-layer:empty { display: none; }

        /* Dynamic: 左对齐标题 + 底部右对齐字幕 + 对角线渐变 */
        .gradient-overlay {
            position: absolute; top: 0; left: 0;
            width: 100%; height: 100%; z-index: 1;
            background: linear-gradient(170deg,
                rgba(0,0,0,0.25) 0%,
                rgba(0,0,0,0.00) 30%,
                rgba(0,0,0,0.00) 55%,
                rgba(0,0,0,0.75) 100%);
        }
        .content-layer {
            position: relative; z-index: 2;
            width: 100%; height: 100%;
            padding: 72px 70px 0px 70px;
            box-sizing: border-box;
            display: flex; flex-direction: column;
            justify-content: flex-start;
        }
        .video-title {
            font-size: 56px; font-weight: 800;
            line-height: 1.25; text-align: left;
            margin-bottom: 0;
            color: #ffffff;
            text-shadow: 0 0 20px rgba(0,0,0,0.85), 0 4px 8px rgba(0,0,0,0.5);
        }
        .video-title:empty { display: none; }
        .spacer { flex-grow: 1; }
        .subtitle-wrapper {
            margin-bottom: 56px; text-align: right;
        }
        .text-pill {
            display: inline-block;
            max-width: 85%;
            padding: 22px 40px;
            border-radius: 14px;
            font-size: {{text_size=50}}px;
            font-weight: 700;
            line-height: 1.5;
            color: #ffffff;
            word-break: break-word;
            background: rgba(0,0,0,0.50);
            backdrop-filter: blur(8px);
            border-left: 5px solid rgba(255,255,255,0.25);
            text-shadow: 0 2px 10px rgba(0,0,0,0.6);
        }
    </style>
</head>
<body>
    <div class="page-container">
        <div class="background-layer" id="bg-layer"></div>
        <div class="gradient-overlay"></div>
        <div class="content-layer">
            <div class="video-title">{{title}}</div>
            <div class="spacer"></div>
            <div class="subtitle-wrapper">
                <span class="text-pill">{{text}}</span>
            </div>
        </div>
    </div>
    <script>
        (function() {
            var imageUrl = "{{image}}";
            var bgLayer = document.getElementById('bg-layer');
            if (imageUrl && imageUrl.trim() !== "" && imageUrl !== "None") {
                var ext = imageUrl.split('.').pop().toLowerCase().split('?')[0];
                if (['mp4','mov','webm','avi'].indexOf(ext) >= 0) {
                } else {
                    var img = document.createElement('img');
                    img.src = imageUrl;
                    img.alt = "";
                    bgLayer.appendChild(img);
                }
            }
        })();
    </script>
</body>
</html>
