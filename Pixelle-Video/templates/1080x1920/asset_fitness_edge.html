<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="template:media-width" content="1024">
    <meta name="template:media-height" content="1024">
    <style>
        {{font_import}}
        html, body {
            margin: 0; padding: 0;
            width: 1080px; height: 1920px;
            overflow: hidden;
        }
        body {
            font-family: '{{font_name=PingFang SC}}', 'PingFang SC', 'Source Han Sans', 'Microsoft YaHei', sans-serif;
            background: transparent;
        }
        .page-container {
            width: 1080px; height: 1920px;
            position: relative; overflow: hidden;
        }
        .background-layer {
            position: absolute; top: 0; left: 0;
            width: 100%; height: 100%; z-index: 0;
        }
        .background-layer img, .background-layer video {
            width: 100%; height: 100%;
            object-fit: cover; display: block;
        }
        .background-layer:empty { display: none; }

        /* Edge: 标题左上角小标 + 底部满宽字幕条 + 横向渐变底栏 */
        .gradient-overlay {
            position: absolute; top: 0; left: 0;
            width: 100%; height: 100%; z-index: 1;
            background: linear-gradient(to bottom,
                rgba(0,0,0,0.20) 0%,
                rgba(0,0,0,0.00) 12%,
                rgba(0,0,0,0.00) 78%,
                rgba(0,0,0,0.55) 92%,
                rgba(0,0,0,0.90) 100%);
        }
        .content-layer {
            position: relative; z-index: 2;
            width: 100%; height: 100%;
            padding: 60px 64px 0px 64px;
            box-sizing: border-box;
            display: flex; flex-direction: column;
            justify-content: flex-start;
        }
        .video-title {
            font-size: 28px; font-weight: 700;
            line-height: 1.2; text-align: left;
            margin-bottom: 0; padding: 10px 24px;
            color: #ffffff;
            background: rgba(0,0,0,0.55);
            backdrop-filter: blur(10px);
            border-radius: 4px;
            display: inline-block;
            align-self: flex-start;
            letter-spacing: 0.08em;
            text-transform: uppercase;
        }
        .video-title:empty { display: none; }
        .spacer { flex-grow: 1; }
        .subtitle-wrapper {
            margin-bottom: 0px;
            margin-left: -64px; margin-right: -64px;
            text-align: center;
        }
        .text-pill {
            display: block;
            width: 100%;
            padding: 32px 64px 28px 64px;
            font-size: {{text_size=46}}px;
            font-weight: 700;
            line-height: 1.4;
            color: #ffffff;
            word-break: break-word;
            background: linear-gradient(135deg,
                rgba(0,0,0,0.85) 0%,
                rgba(20,20,20,0.75) 100%);
            backdrop-filter: blur(16px);
            border-top: 2px solid rgba(255,255,255,0.12);
            letter-spacing: 0.02em;
            text-shadow: 0 0 12px rgba(0,0,0,0.6);
        }
    </style>
</head>
<body>
    <div class="page-container">
        <div class="background-layer" id="bg-layer"></div>
        <div class="gradient-overlay"></div>
        <div class="content-layer">
            <div class="video-title">{{title}}</div>
            <div class="spacer"></div>
            <div class="subtitle-wrapper">
                <span class="text-pill">{{text}}</span>
            </div>
        </div>
    </div>
    <script>
        (function() {
            var imageUrl = "{{image}}";
            var bgLayer = document.getElementById('bg-layer');
            if (imageUrl && imageUrl.trim() !== "" && imageUrl !== "None") {
                var ext = imageUrl.split('.').pop().toLowerCase().split('?')[0];
                if (['mp4','mov','webm','avi'].indexOf(ext) >= 0) {
                } else {
                    var img = document.createElement('img');
                    img.src = imageUrl;
                    img.alt = "";
                    bgLayer.appendChild(img);
                }
            }
        })();
    </script>
</body>
</html>
