<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="template:media-width" content="1024">
    <meta name="template:media-height" content="1024">
    <style>
        {{font_import}}
        html, body {
            margin: 0; padding: 0;
            width: 1080px; height: 1920px;
            overflow: hidden;
        }
        body {
            font-family: '{{font_name=PingFang SC}}', 'PingFang SC', 'Source Han Sans', 'Microsoft YaHei', sans-serif;
            background: transparent;
        }
        .page-container {
            width: 1080px; height: 1920px;
            position: relative; overflow: hidden;
        }
        .background-layer {
            position: absolute; top: 0; left: 0;
            width: 100%; height: 100%; z-index: 0;
        }
        .background-layer img, .background-layer video {
            width: 100%; height: 100%;
            object-fit: cover; display: block;
        }
        .background-layer:empty { display: none; }

        /* Impact: 底部超大标题 + 剧中字幕 + 底部强黑渐变 */
        .gradient-overlay {
            position: absolute; top: 0; left: 0;
            width: 100%; height: 100%; z-index: 1;
            background: linear-gradient(to bottom,
                rgba(0,0,0,0.10) 0%,
                rgba(0,0,0,0.00) 40%,
                rgba(0,0,0,0.05) 60%,
                rgba(0,0,0,0.60) 80%,
                rgba(0,0,0,0.95) 100%);
        }
        .content-layer {
            position: relative; z-index: 2;
            width: 100%; height: 100%;
            padding: 0px 80px 0px 80px;
            box-sizing: border-box;
            display: flex; flex-direction: column;
            justify-content: flex-end;
        }
        .video-title {
            font-size: 68px; font-weight: 900;
            line-height: 1.2; text-align: center;
            margin-bottom: 20px;
            color: {{text_color=#ffffff}};
            text-shadow: 0 0 40px rgba(0,0,0,0.9), 0 8px 20px rgba(0,0,0,0.7);
            text-transform: uppercase;
            letter-spacing: 0.04em;
        }
        .video-title:empty { display: none; }
        .spacer { flex-grow: 1; }
        .subtitle-wrapper {
            margin-bottom: 52px; text-align: center;
        }
        .text-pill {
            display: inline-block;
            max-width: 92%;
            padding: 20px 44px;
            border-radius: 12px;
            font-size: 44px;
            font-weight: 600;
            line-height: 1.4;
            color: #ffffff;
            word-break: break-word;
            text-shadow: 0 0 20px rgba(0,0,0,0.8);
        }
    </style>
</head>
<body>
    <div class="page-container">
        <div class="background-layer" id="bg-layer"></div>
        <div class="gradient-overlay"></div>
        <div class="content-layer">
            <div class="video-title">{{title}}</div>
            <div class="spacer"></div>
            <div class="subtitle-wrapper">
                <span class="text-pill">{{text}}</span>
            </div>
        </div>
    </div>
    <script>
        (function() {
            var imageUrl = "{{image}}";
            var bgLayer = document.getElementById('bg-layer');
            if (imageUrl && imageUrl.trim() !== "" && imageUrl !== "None") {
                var ext = imageUrl.split('.').pop().toLowerCase().split('?')[0];
                if (['mp4','mov','webm','avi'].indexOf(ext) >= 0) {
                } else {
                    var img = document.createElement('img');
                    img.src = imageUrl;
                    img.alt = "";
                    bgLayer.appendChild(img);
                }
            }
        })();
    </script>
</body>
</html>
